name: APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

env:
  JAVA_VERSION: "17"          # ← تعديل 1

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"   # ← تعديل 2

      - name: Disable Kotlin incremental compilation (CI)
        run: |
          mkdir -p ~/.gradle
          echo "kotlin.incremental=false" >> ~/.gradle/gradle.properties

      - name: Build debug APK
        run: ./gradlew :ide-android:assembleDebug --console=plain --stacktrace

      - name: Debug - list all APKs
        if: always()                                                             # ← تعديل 3
        run: find . -name "*.apk" -type f -not -path "*/\.gradle/*"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: codeassist-debug-apk
          path: ide-android/build/outputs/apk/debug/*.apk                      # ← تعديل 4
          if-no-files-found: warn                                              # ← تعديل 5
          retention-days: 30

  build-release:
    name: assembleRelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"   # ← تعديل 2

      - name: Disable Kotlin incremental compilation (CI)
        run: |
          mkdir -p ~/.gradle
          echo "kotlin.incremental=false" >> ~/.gradle/gradle.properties

      - name: Generate CI keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=CI, OU=CI, O=CI, L=CI, ST=CI, C=EG"

      - name: Create keystore.properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=android
          keyAlias=release
          keyPassword=android
          EOF

      - name: Build release APK
        run: ./gradlew :ide-android:assembleRelease --console=plain --stacktrace

      - name: Debug - list all APKs
        if: always()                                                             # ← تعديل 3
        run: find . -name "*.apk" -type f -not -path "*/\.gradle/*"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: codeassist-release-apk
          path: ide-android/build/outputs/apk/release/*.apk                    # ← تعديل 4
          if-no-files-found: warn                                              # ← تعديل 5
          retention-days: 30
